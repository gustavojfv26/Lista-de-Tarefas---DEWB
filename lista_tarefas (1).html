<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas</title>
    <style>
        h1 {
            text-align: center;
            color: #0f172a;
            font-size: 36px;
            margin-bottom: 30px;
            font-weight: bold;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #64748b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        #lista {
            width: 100%;
            max-width: 700px;
        }

        fieldset {
            border: none;
            background-color: #f8fafc;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            counter-reset: tarefa;

        }
        button {
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.05);
        }

        button:active {
            transform: scale(0.95);
        }

        fieldset > button {
            display: block;
            margin: 25px auto 0 auto;
            background-color: #3CB371;
            color: white;
            padding: 12px 22px;
            font-size: 15px;
        }

        fieldset div {
            display: flex;
            align-items: center;
            gap: 10px;
            background-color: #f8fafc;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 12px;
            transition: 0.3s;
            counter-increment: tarefa;
        }


        fieldset div:hover {
            background-color: #e2e8f0;
        }
        
        fieldset div label::before {
            content: counter(tarefa) ". ";
            color: #1e293b;
        }

        label {
            flex: 1;
            font-size: 16px;
            color: #1e293b;
        }

        input[type="checkbox"] {
            accent-color: #3CB371;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        fieldset div button:nth-of-type(1) {
            background-color: #FFD700;
            color: white;
        }

        fieldset div button:nth-of-type(1):hover {
            background-color: #FFD700;
        }

        fieldset div button:nth-of-type(2) {
            background-color: #ef4444;
            color: white;
        }

        fieldset div button:nth-of-type(2):hover {
            background-color: #dc2626;
        }
        .concluida {
            text-decoration: line-through;
            color: gray;
            opacity: 0.7;
        }
        .concluida {
            text-decoration: line-through;
            color: gray;
        }
    </style>
    <script>

        function editarTarefa(label) {
            let novoNome = prompt("Informe o novo nome da tarefa:");
            if (novoNome != null && novoNome != "") {
                label.innerHTML = novoNome;
            }
        }
        function removerTarefa(botao) {
            let resp = confirm("Você tem certeza que deseja remover?");
            if (resp == true) {
                botao.parentElement.remove();
            }
        }
        function concluirTarefa(checkbox, label) {
            if (checkbox.checked) {
                label.classList.add("concluida");
            } else {
                label.classList.remove("concluida");
            }
        }
        function adicionarTarefa() {
            let texto = prompt("Digite a nova tarefa:");
            if (texto == null || texto == "") {
                return;
            }
            let lista = document.querySelector("#lista fieldset");

            let div = document.createElement("div");

            let checkbox = document.createElement("input");
            checkbox.type = "checkbox";

            let label = document.createElement("label");
            label.innerHTML = texto;

            checkbox.onclick = function() {
                concluirTarefa(checkbox, label);
            };

            let botaoEditar = document.createElement("button");
            botaoEditar.innerHTML = "Editar";

            botaoEditar.onclick = function() {
                editarTarefa(label);
            };

            let botaoRemover = document.createElement("button");
            botaoRemover.innerHTML = "Remover";

            botaoRemover.onclick = function() {
                removerTarefa(botaoRemover);
            };

            div.appendChild(checkbox);
            div.appendChild(label);
            div.appendChild(botaoEditar);
            div.appendChild(botaoRemover);

            lista.insertBefore(div, lista.lastElementChild);
        }

    </script>
</head>
<body>
    <div id="lista">
        <fieldset>
             <h1 style="text-align: center;">Lista de Tarefas</h1>

            <div>
                <input type="checkbox" onclick="concluirTarefa(this, this.nextElementSibling)">
                <label for="tarefa1">Estudar para prova de Matemática Discreta</label>
                <button onclick="editarTarefa(this.previousElementSibling)">Editar</button>
                <button onclick="removerTarefa(this)">Remover</button>
            </div>
            <div>
                <input type="checkbox" onclick="concluirTarefa(this, this.nextElementSibling)">
                <label for="tarefa1">Fazer os exercícios de Algoritimos</label>
                <button onclick="editarTarefa(this.previousElementSibling)">Editar</button>
                <button onclick="removerTarefa(this)">Remover</button>
            </div>
            <div>
                <input type="checkbox" onclick="concluirTarefa(this, this.nextElementSibling)">
                <label for="tarefa1">Fazer o trabalho de Desenvolvimento Web</label>
                <button onclick="editarTarefa(this.previousElementSibling)">Editar</button>
                <button onclick="removerTarefa(this)">Remover</button>
            </div>
            <div>
                <input type="checkbox" onclick="concluirTarefa(this, this.nextElementSibling)">
                <label for="tarefa1">Gravar o vídeo do trabalho de IHC</label>
                <button onclick="editarTarefa(this.previousElementSibling)">Editar</button>
                <button onclick="removerTarefa(this)">Remover</button>
            </div>
            <div>
                <input type="checkbox" onclick="concluirTarefa(this, this.nextElementSibling)">
                <label for="tarefa1">Apresentar o trabalho de IHC</label>
                <button onclick="editarTarefa(this.previousElementSibling)">Editar</button>
                <button onclick="removerTarefa(this)">Remover</button>
            </div>
            <div>
                <input type="checkbox" onclick="concluirTarefa(this, this.nextElementSibling)">
                <label for="tarefa1">Apresentar o trabalho de FENS</label>
                <button onclick="editarTarefa(this.previousElementSibling)">Editar</button>
                <button onclick="removerTarefa(this)">Remover</button>
            </div>

            <button onclick="adicionarTarefa()">Adicionar Tarefa</button>
        </fieldset>
    </div>
</body>
</html>
